name: Wind Tunnel CI

on:
  push:
    branches: [main, wind-tunnel-monorepo-v2]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify architecture boundaries
        run: |
          test -f apps/api/src/index.ts
          test -f apps/worker/src/index.ts
          test -f packages/subject-manager/src/index.ts
          grep -q "claimNextRun" apps/worker/src/index.ts
          grep -q "ensureSubject" apps/worker/src/index.ts
          grep -q "pnpm-lock.yaml" packages/subject-manager/src/index.ts
          if grep -R "workstation-mcp\|oauth-gateway" apps packages; then
            echo "MCP/OAuth must not be in the active v2 path"
            exit 1
          fi
      - name: Build API image
        run: docker build -f Dockerfile.control -t nazare-wind-tunnel-api:ci .
      - name: Build worker image
        run: docker build -f Dockerfile.worker -t nazare-wind-tunnel-worker:ci .
