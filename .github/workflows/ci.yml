name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - name: Verify production entrypoint
        run: |
          node -e "const p=require('./package.json'); if (p.scripts?.start !== 'tsx src/workstation-mcp.ts') process.exit(1)"
          grep -q 'CMD \["npm", "start"\]' Dockerfile.control
      - name: Build production container
        run: docker build -f Dockerfile.control -t nazare-wind-tunnel:ci .
      - name: Verify Wind Tunnel controls
        run: |
          grep -q 'WIND_TUNNEL_TARGET_SHA' README.md
          grep -q 'maxSeconds' benchmark/config.json
          grep -q 'maxToolCalls' benchmark/config.json
          grep -q 'environment/' README.md
          grep -q 'budget_exceeded' src/workstation-runner.ts
          grep -q 'run_test' src/workstation-mcp.ts
